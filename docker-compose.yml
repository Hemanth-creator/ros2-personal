version: "3.8"

services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2_dev_personal
    environment:
      - DISPLAY=${DISPLAY}  # Forward X11 display
      - QT_X11_NO_MITSHM=1  # Required for some GUI apps
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix  # X11 socket
      - ./ros2_ws:/ros2_ws  # Mount workspace (optional)
    network_mode: "host"  # Use host networking for Gazebo and ROS
    stdin_open: true
    tty: true
    command: bash

    # Optional: If you want sound or GUI acceleration
    devices:
      - /dev/dri:/dev/dri  # GPU acceleration (optional)
