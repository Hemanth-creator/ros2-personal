version: "3.8"

services:
  ros2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros2_dev_personal
    environment:
      # Linux/macOS/Windows
      - DISPLAY=${DISPLAY:-host.docker.internal:0}  
    volumes:
      - ./src:/home/ros2_ws/src       # Mount your workspace
    tty: true
